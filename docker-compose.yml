version: '3.8'

services:
  rice-api:
    build: .
    container_name: rice_genomics_api
    ports:
      - "8000:8000"
    # Gunakan env_file untuk meneruskan SEMUA variabel dari .env termasuk NCBI_API_KEY
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
