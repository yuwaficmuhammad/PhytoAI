<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Rice Grain Gold Gradient -->
    <linearGradient id="riceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- DNA Helix Cyan Gradient -->
    <linearGradient id="dnaCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald Leaf Sprout Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base Icon -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Inner Border Glow -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="13.5" fill="none" stroke="#6ee7b7" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- DNA Double Helix Waves (Background Layer) -->
  <g filter="url(#glow)" opacity="0.95">
    <!-- Strand 1 (Cyan) -->
    <path d="M 20 48 C 28 44, 36 36, 44 32 C 36 28, 28 20, 20 16" 
          fill="none" stroke="url(#dnaCyan)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Strand 2 (Emerald) -->
    <path d="M 44 48 C 36 44, 28 36, 20 32 C 28 28, 36 20, 44 16" 
          fill="none" stroke="url(#leafGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Hydrogen Base Pair Rungs -->
    <line x1="23" y1="45" x2="41" y2="45" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="28" y1="38" x2="36" y2="38" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="32" cy="32" r="2.2" fill="#fef08a" />
    <line x1="28" y1="26" x2="36" y2="26" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" />
    <line x1="23" y1="19" x2="41" y2="19" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Stylized Rice Grain (Central Foreground Symbol) -->
  <g filter="url(#glow)">
    <!-- Main Rice Seed Oval -->
    <path d="M 32 10 C 39 18, 43 28, 38 42 C 34 50, 28 50, 25 43 C 21 31, 24 18, 32 10 Z" 
          fill="url(#riceGold)" stroke="#fef3c7" stroke-width="1" />
    
    <!-- Rice Grain Longitudinal Furrow / Line -->
    <path d="M 32 12 Q 34 26 31 43" 
          fill="none" stroke="#b45309" stroke-width="1" stroke-linecap="round" opacity="0.75" />

    <!-- Rice Sprout Leaf Emerging from Apex -->
    <path d="M 32 10 C 35 6, 42 6, 45 8 C 44 12, 38 12, 32 10 Z" 
          fill="url(#leafGrad)" />
    
    <path d="M 32 10 C 29 5, 23 4, 20 7 C 22 11, 27 11, 32 10 Z" 
          fill="#34d399" opacity="0.9" />

    <!-- Sparkle / Genetic Edit Starlet (Crispr Precision Edit Accent) -->
    <path d="M 45 22 Q 47 25 50 25 Q 47 25 45 28 Q 45 25 42 25 Q 45 25 45 22 Z" 
          fill="#38bdf8" />
    <circle cx="45" cy="25" r="1" fill="#ffffff" />
  </g>
</svg>

